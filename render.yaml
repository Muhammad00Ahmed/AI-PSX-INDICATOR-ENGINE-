services:
  - type: web
    name: psx-market-engine-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: https://ai-psx-indicator.vercel.app,http://localhost:5173,http://localhost:3000
    plan: starter
    autoDeploy: true